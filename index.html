const scene=new THREE.Scene();scene.background=new THREE.Color(0x07111f);const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.05,150),rig=new THREE.Group();camera.position.y=1.65;rig.position.set(0,0,6);rig.add(camera);scene.add(rig);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;document.getElementById('stage').appendChild(renderer.domElement);const hemi=new THREE.HemisphereLight(0xdbeafe,0x172033,.85);scene.add(hemi);const sun=new THREE.DirectionalLight(0xffffff,.85);sun.position.set(5,9,5);sun.castShadow=true;scene.add(sun);const pmrem=new THREE.PMREMGenerator(renderer);pmrem.compileEquirectangularShader();let sourceHDR=null,environmentHDR=null,showBackground=false;

let yaw=0,pitch=0,drag=false,lx=0,ly=0,vm=null;renderer.domElement.style.touchAction='none';renderer.domElement.onpointerdown=e=>{drag=true;lx=e.clientX;ly=e.clientY;renderer.domElement.setPointerCapture?.(e.pointerId)};renderer.domElement.onpointermove=e=>{if(!drag)return;yaw-=(e.clientX-lx)*.004;pitch=THREE.MathUtils.clamp(pitch-(e.clientY-ly)*.004,-1.3,1.3);camera.rotation.set(pitch,yaw,0,'YXZ');lx=e.clientX;ly=e.clientY};renderer.domElement.onpointerup=e=>{drag=false;renderer.domElement.releasePointerCapture?.(e.pointerId)};const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);document.querySelectorAll('.move').forEach(b=>{const start=e=>{e.preventDefault();vm=b.dataset.m==='x'?null:b.dataset.m;b.classList.add('active')},stop=e=>{e.preventDefault();vm=null;b.classList.remove('active')};b.onpointerdown=start;b.onpointerup=stop;b.onpointercancel=stop;b.onpointerleave=stop});document.getElementById('home').onclick=()=>{rig.position.set(0,0,6);yaw=pitch=0;camera.rotation.set(0,0,0)};const clock=new THREE.Clock();renderer.setAnimationLoop(()=>{const dt=Math.min(.05,clock.getDelta()),f=new THREE.Vector3();camera.getWorldDirection(f);f.y=0;f.normalize();const r=new THREE.Vector3().crossVectors(f,camera.up).normalize(),sp=2.7*dt;if(keys.z||keys.w||keys.arrowup||vm==='f')rig.position.addScaledVector(f,sp);if(keys.s||keys.arrowdown||vm==='b')rig.position.addScaledVector(f,-sp);if(keys.q||keys.a||keys.arrowleft||vm==='l')rig.position.addScaledVector(r,-sp);if(keys.d||keys.arrowright||vm==='r')rig.position.addScaledVector(r,sp);rig.position.x=THREE.MathUtils.clamp(rig.position.x,-8.4,8.4);rig.position.z=THREE.MathUtils.clamp(rig.position.z,-6.7,6.7);renderer.render(scene,camera)});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});loadPolyHaven();
