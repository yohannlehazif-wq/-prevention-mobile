<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>RESTEV 85 - Chasse aux Risques VR & Mobile</title>
    <style>
        :root {
            --primary: #005a9c;
            --primary-dark: #003d6b;
            --secondary: #00a88f;
            --danger: #e74c3c;
            --success: #2ecc71;
            --warning: #f39c12;
            --bg-dark: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000;
            color: #fff;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Interface utilisateur (UI) */
        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 12px;
        }

        .interactive {
            pointer-events: auto;
        }

        /* Header RESTEV */
        header {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            padding: 10px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .logo-title h1 {
            font-size: 1.1rem;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-title span {
            color: var(--secondary);
            font-size: 0.8rem;
            display: block;
            font-weight: 400;
        }

        .score-badge {
            background: var(--primary);
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            border: 1px solid rgba(255,255,255,0.2);
            white-space: nowrap;
        }

        /* Raccourcis de Téléportation */
        .nav-shortcuts {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding: 6px 0;
            -webkit-overflow-scrolling: touch;
        }

        .nav-btn {
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
            backdrop-filter: blur(4px);
        }

        .nav-btn:active {
            transform: scale(0.95);
            background: var(--primary);
        }

        /* D-Pad Tactile pour déplacement mobile */
        .controls-bottom {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 8px;
        }

        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 42px);
            grid-template-rows: repeat(3, 42px);
            gap: 4px;
            background: rgba(15, 23, 42, 0.6);
            padding: 6px;
            border-radius: 12px;
            backdrop-filter: blur(4px);
        }

        .dpad-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: white;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .dpad-btn:active {
            background: var(--secondary);
        }

        .btn-vr {
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            border: none;
            color: white;
            padding: 12px 20px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 0.9rem;
            box-shadow: 0 4px 15px rgba(0, 168, 143, 0.4);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Modal Pédagogique */
        .modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(6px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            max-width: 480px;
            width: 100%;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            transform: translateY(20px);
            transition: transform 0.3s ease;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal.active .modal-content {
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .modal-icon {
            font-size: 2rem;
            background: rgba(231, 76, 60, 0.2);
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--danger);
        }

        .modal-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
        }

        .modal-body {
            font-size: 0.9rem;
            line-height: 1.5;
            color: #cbd5e1;
            margin-bottom: 20px;
        }

        .ref-box {
            background: rgba(0, 90, 156, 0.2);
            border-left: 3px solid var(--primary);
            padding: 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            margin-top: 10px;
            color: #93c5fd;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
        }

        .btn-action {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            font-size: 0.9rem;
        }

        .btn-fix {
            background: var(--success);
            color: #fff;
        }

        .btn-close {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        /* Message d'aide au démarrage */
        .start-hint {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: #cbd5e1;
            pointer-events: none;
            animation: pulse 2s infinite;
            white-space: nowrap;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
    </style>
    <!-- Importation directe de Three.js r128 universelle -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="ui-overlay">
        <!-- En-tête -->
        <header class="interactive">
            <div class="logo-title">
                <h1>RESTEV 85 <span>Prévention des Risques</span></h1>
            </div>
            <div class="score-badge" id="score">0 / 5 Anomalies</div>
        </header>

        <div class="start-hint">👉 Touchez un point rouge pour analyser le risque</div>

        <!-- Navigation rapide -->
        <div class="nav-shortcuts interactive">
            <button class="nav-btn" onclick="teleportTo('global')">🌐 Vue Globale</button>
            <button class="nav-btn" onclick="teleportTo('chimique')">🛢️ Risque Chimique</button>
            <button class="nav-btn" onclick="teleportTo('electrique')">⚡ Câble Éléc.</button>
            <button class="nav-btn" onclick="teleportTo('gaz')">🍾 Bouteilles Gaz</button>
            <button class="nav-btn" onclick="teleportTo('extincteur')">🧯 Extincteur</button>
            <button class="nav-btn" onclick="teleportTo('meuleuse')">⚙️ Meuleuse</button>
        </div>

        <!-- Contrôles bas de page -->
        <div class="controls-bottom">
            <!-- D-Pad pour déplacement -->
            <div class="dpad interactive">
                <div></div>
                <button class="dpad-btn" onmousedown="moveCam('forward')" ontouchstart="moveCam('forward')">⬆️</button>
                <div></div>
                <button class="dpad-btn" onmousedown="moveCam('left')" ontouchstart="moveCam('left')">⬅️</button>
                <button class="dpad-btn" onclick="teleportTo('global')">🎯</button>
                <button class="dpad-btn" onmousedown="moveCam('right')" ontouchstart="moveCam('right')">➡️</button>
                <div></div>
                <button class="dpad-btn" onmousedown="moveCam('backward')" ontouchstart="moveCam('backward')">⬇️</button>
                <div></div>
            </div>

            <!-- Bouton VR -->
            <button class="btn-vr interactive" id="vr-btn" onclick="startVR()">🥽 Mode VR</button>
        </div>
    </div>

    <!-- Fenêtre Modale Pédagogique -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-icon" id="m-icon">⚠️</div>
                <div class="modal-title" id="m-title">Titre de l'anomalie</div>
            </div>
            <div class="modal-body">
                <p id="m-desc">Description de la situation dangereuse...</p>
                <div class="ref-box" id="m-ref">
                    <strong>Réglementation :</strong> Code du Travail / INRS
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn-action btn-close" onclick="closeModal()">Ignorer</button>
                <button class="btn-action btn-fix" id="m-fix-btn" onclick="fixCurrentRisk()">Corriger le risque</button>
            </div>
        </div>
    </div>

    <script>
        // --- DONNÉES DES 5 RISQUES ---
        const risksData = {
            chimique: {
                id: 'chimique',
                title: 'Bidon Chimique Hors Rétention',
                icon: '🛢️',
                desc: 'Un solvant inflammable est posé directement sur le sol sans bac de rétention et sans Fiche de Données de Sécurité (FDS) accessible.',
                ref: 'Code du Travail Art. R4412-17 & R4412-22 (Stockage sous rétention obligatoire).',
                pos: { x: -3.5, y: 1.2, z: -2 },
                fixed: false
            },
            electrique: {
                id: 'electrique',
                title: 'Câble Électrique au Sol / Dénudé',
                icon: '⚡',
                desc: 'Un câble de rallonge traverse l allée de circulation. Risque majeur de chute de plein pied et d électrocution par détérioration.',
                ref: 'Code du Travail Art. R4224-3 (Allées de circulation dégagées) & Art. R4226-9.',
                pos: { x: 0, y: 0.3, z: 1 },
                fixed: false
            },
            gaz: {
                id: 'gaz',
                title: 'Bouteilles de Gaz Non Arrimées',
                icon: '🍾',
                desc: 'Les bouteilles d acétylène et d oxygène sont debout sans chaîne de maintien. Risque de chute, de rupture de valve et d explosion.',
                ref: 'INRS ED 6098 (Stockage et arrimage sécurisé des bouteilles de gaz sous pression).',
                pos: { x: 3.8, y: 1.5, z: -3.5 },
                fixed: false
            },
            extincteur: {
                id: 'extincteur',
                title: 'Accès Extincteur Encombré',
                icon: '🧯',
                desc: 'Des cartons et palettes masquent et bloquent l accès direct à l extincteur d atelier en cas de départ de feu.',
                ref: 'Code du Travail Art. R4227-33 (Les équipements de secours doivent être dégagés et accessibles).',
                pos: { x: 4.2, y: 1.2, z: 2 },
                fixed: false
            },
            meuleuse: {
                id: 'meuleuse',
                title: 'Meuleuse sans Carter de Protection',
                icon: '⚙️',
                desc: 'La meuleuse d angle posée sur l établi n a plus son carter de protection de disque. Risque de projection d éclat métallique mortel.',
                ref: 'Code du Travail Art. R4324-1 à R4324-4 (Protections sur éléments mobiles de travail).',
                pos: { x: -1.5, y: 1.3, z: -3.8 },
                fixed: false
            }
        };

        let currentActiveRisk = null;
        let scoreCount = 0;

        // --- ENGINE 3D & SCENE SETUP ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1e293b);
        scene.fog = new THREE.FogExp2(0x1e293b, 0.03);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 2.2, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        // Lumières
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 7);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // --- CRÉATION DU DÉCOR DE L'ATELIER ---
        function buildWorkshop() {
            // Sol
            const floorGeo = new THREE.PlaneGeometry(12, 10);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.8 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // Mur de fond
            const wallGeo = new THREE.PlaneGeometry(12, 5);
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x1e293b });
            const wall = new THREE.Mesh(wallGeo, wallMat);
            wall.position.set(0, 2.5, -5);
            scene.add(wall);

            // Bande de sécurité jaune/noire au sol
            const stripeGeo = new THREE.PlaneGeometry(10, 0.4);
            const stripeMat = new THREE.MeshBasicMaterial({ color: 0xf39c12 });
            const stripe = new THREE.Mesh(stripeGeo, stripeMat);
            stripe.rotation.x = -Math.PI / 2;
            stripe.position.set(0, 0.01, 0);
            scene.add(stripe);

            // Établi mécanique
            const benchGeo = new THREE.BoxGeometry(3, 0.9, 1.2);
            const benchMat = new THREE.MeshStandardMaterial({ color: 0x475569 });
            const bench = new THREE.Mesh(benchGeo, benchMat);
            bench.position.set(-2, 0.45, -4);
            bench.castShadow = true;
            scene.add(bench);
        }

        buildWorkshop();

        // --- CRÉATION DES OBJETS 3D PÉDAGOGIQUES ---
        const risk3DObjects = {};

        function createRiskObjects() {
            // 1. Bidon Chimique
            const canGroup = new THREE.Group();
            const canGeo = new THREE.CylinderGeometry(0.25, 0.25, 0.6, 16);
            const canMat = new THREE.MeshStandardMaterial({ color: 0xe74c3c });
            const can = new THREE.Mesh(canGeo, canMat);
            canGroup.add(can);
            canGroup.position.set(-3.5, 0.3, -2);
            scene.add(canGroup);
            risk3DObjects.chimique = canGroup;

            // 2. Câble électrique au sol
            const cableGeo = new THREE.CylinderGeometry(0.04, 0.04, 3, 8);
            const cableMat = new THREE.MeshStandardMaterial({ color: 0xf1c40f });
            const cable = new THREE.Mesh(cableGeo, cableMat);
            cable.rotation.z = Math.PI / 2;
            cable.position.set(0, 0.04, 1);
            scene.add(cable);
            risk3DObjects.electrique = cable;

            // 3. Bouteilles de gaz
            const gazGroup = new THREE.Group();
            const botGeo = new THREE.CylinderGeometry(0.18, 0.18, 1.2, 12);
            const botMat = new THREE.MeshStandardMaterial({ color: 0x27ae60 });
            const bot = new THREE.Mesh(botGeo, botMat);
            gazGroup.add(bot);
            gazGroup.position.set(3.8, 0.6, -3.5);
            scene.add(gazGroup);
            risk3DObjects.gaz = gazGroup;

            // 4. Extincteur masqué
            const extGroup = new THREE.Group();
            const extGeo = new THREE.CylinderGeometry(0.15, 0.15, 0.7, 12);
            const extMat = new THREE.MeshStandardMaterial({ color: 0xc0392b });
            const ext = new THREE.Mesh(extGeo, extMat);
            extGroup.add(ext);
            extGroup.position.set(4.2, 0.35, 2);
            scene.add(extGroup);
            risk3DObjects.extincteur = extGroup;

            // 5. Meuleuse sur établi
            const toolGeo = new THREE.BoxGeometry(0.4, 0.15, 0.2);
            const toolMat = new THREE.MeshStandardMaterial({ color: 0x34495e });
            const tool = new THREE.Mesh(toolGeo, toolMat);
            tool.position.set(-1.5, 0.98, -3.8);
            scene.add(tool);
            risk3DObjects.meuleuse = tool;

            // Ajout des Hotspots rouges clignotants
            Object.keys(risksData).forEach(key => {
                const r = risksData[key];
                const hotspotGeo = new THREE.SphereGeometry(0.18, 16, 16);
                const hotspotMat = new THREE.MeshBasicMaterial({ color: 0xe74c3c, wireframe: true });
                const hotspot = new THREE.Mesh(hotspotGeo, hotspotMat);
                hotspot.position.set(r.pos.x, r.pos.y, r.pos.z);
                hotspot.userData = { riskId: key };
                scene.add(hotspot);
            });
        }

        createRiskObjects();

        // --- ROTATION ET NAVIGATION TACTILE SANS DEPENDANCE ---
        let isDragging = false;
        let previousTouchX = 0;
        let previousTouchY = 0;
        let targetYaw = 0;
        let targetPitch = 0;

        function onPointerDown(e) {
            isDragging = true;
            previousTouchX = e.clientX || (e.touches && e.touches[0].clientX);
            previousTouchY = e.clientY || (e.touches && e.touches[0].clientY);
        }

        function onPointerMove(e) {
            if (!isDragging) return;
            const x = e.clientX || (e.touches && e.touches[0].clientX);
            const y = e.clientY || (e.touches && e.touches[0].clientY);
            
            const deltaX = x - previousTouchX;
            const deltaY = y - previousTouchY;

            targetYaw -= deltaX * 0.005;
            targetPitch -= deltaY * 0.005;
            targetPitch = Math.max(-Math.PI / 4, Math.min(Math.PI / 4, targetPitch));

            previousTouchX = x;
            previousTouchY = y;
        }

        function onPointerUp() { isDragging = false; }

        window.addEventListener('mousedown', onPointerDown);
        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);
        window.addEventListener('touchstart', onPointerDown);
        window.addEventListener('touchmove', onPointerMove);
        window.addEventListener('touchend', onPointerUp);

        // --- RAYCASTING POUR CLIC SUR LES ANOMALIES ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function handleSelect(e) {
            const clientX = e.clientX || (e.changedTouches && e.changedTouches[0].clientX);
            const clientY = e.clientY || (e.changedTouches && e.changedTouches[0].clientY);

            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(scene.children, true);

            for (let i = 0; i < intersects.length; i++) {
                const obj = intersects[i].object;
                if (obj.userData && obj.userData.riskId) {
                    openRiskModal(obj.userData.riskId);
                    break;
                }
            }
        }

        window.addEventListener('click', handleSelect);

        // --- MODALE PÉDAGOGIQUE ---
        function openRiskModal(riskId) {
            const data = risksData[riskId];
            if (!data) return;

            currentActiveRisk = data;
            document.getElementById('m-icon').innerText = data.icon;
            document.getElementById('m-title').innerText = data.title;
            document.getElementById('m-desc').innerText = data.desc;
            document.getElementById('m-ref').innerHTML = '<strong>Réglementation :</strong> ' + data.ref;

            const fixBtn = document.getElementById('m-fix-btn');
            if (data.fixed) {
                fixBtn.innerText = '✅ Risque déjà corrigé';
                fixBtn.style.background = '#64748b';
                fixBtn.disabled = true;
            } else {
                fixBtn.innerText = 'Corriger le risque';
                fixBtn.style.background = 'var(--success)';
                fixBtn.disabled = false;
            }

            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        function fixCurrentRisk() {
            if (!currentActiveRisk || currentActiveRisk.fixed) return;

            currentActiveRisk.fixed = true;
            scoreCount++;
            document.getElementById('score').innerText = scoreCount + ' / 5 Anomalies';

            // Animation visuelle de correction 3D (changement de couleur en vert)
            const targetObj = risk3DObjects[currentActiveRisk.id];
            if (targetObj) {
                targetObj.traverse(child => {
                    if (child.isMesh) child.material.color.setHex(0x2ecc71);
                });
            }

            closeModal();

            if (scoreCount === 5) {
                setTimeout(() => {
                    alert('🎉 Félicitations ! Vous avez identifié et corrigé les 5 risques majeurs de l atelier RESTEV 85.');
                }, 500);
            }
        }

        // --- COMMANDES DE TÉLÉPORTATION ET D-PAD ---
        function teleportTo(target) {
            if (target === 'global') {
                camera.position.set(0, 2.2, 5);
                targetYaw = 0;
                targetPitch = 0;
            } else if (risksData[target]) {
                const p = risksData[target].pos;
                camera.position.set(p.x, p.y + 0.3, p.z + 1.8);
            }
        }

        function moveCam(dir) {
            const speed = 0.5;
            if (dir === 'forward') camera.position.z -= speed;
            if (dir === 'backward') camera.position.z += speed;
            if (dir === 'left') camera.position.x -= speed;
            if (dir === 'right') camera.position.x += speed;
        }

        // --- MODE VR WEBXR ---
        function startVR() {
            if ('xr' in navigator) {
                navigator.xr.requestSession('immersive-vr').then(session => {
                    renderer.xr.enabled = true;
                    renderer.xr.setSession(session);
                }).catch(err => {
                    alert('Le casques VR n est pas détecté ou WebXR n est pas actif.');
                });
            } else {
                alert('WebXR n est pas supporté par ce navigateur. Essayez dans le navigateur de votre casque VR (Meta Quest Browser).');
            }
        }

        // --- BOUCLE D'ANIMATION ---
        function animate() {
            renderer.setAnimationLoop(() => {
                camera.rotation.y = targetYaw;
                camera.rotation.x = targetPitch;
                renderer.render(scene, camera);
            });
        }

        animate();

        // Redimensionnement de la fenêtre
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
