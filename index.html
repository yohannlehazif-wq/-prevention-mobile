<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>RESTEV 85 — Simulation WebXR VR Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        
        :root { --bg-dark: #030712; }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; touch-action: none; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: var(--bg-dark); color: #fff; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        .glass-hud { background: rgba(15, 23, 42, 0.88); backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.15); box-shadow: 0 20px 50px rgba(0,0,0,0.7); }
        .glass-card { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(28px); border: 1px solid rgba(255, 255, 255, 0.18); }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 16px; height: 16px; transform: translate(-50%, -50%); border: 2px solid rgba(255, 255, 255, 0.9); border-radius: 50%; pointer-events: none; z-index: 15; transition: all 0.2s; }
        #crosshair::after { content: ''; position: absolute; top: 50%; left: 50%; width: 4px; height: 4px; background: #38bdf8; border-radius: 50%; transform: translate(-50%, -50%); }
        #crosshair.active { border-color: #10b981; background: rgba(16, 185, 129, 0.35); width: 28px; height: 28px; box-shadow: 0 0 20px rgba(16, 185, 129, 0.9); }
        #vignette { position: fixed; inset: 0; z-index: 8; pointer-events: none; background: radial-gradient(circle at center, transparent 40%, rgba(3, 7, 18, 0.65) 100%); }
    </style>
    
    <!-- Three.js + Modules Post-Processing + GLTFLoader -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
</head>
<body>

    <div id="canvas-container"></div>
    <div id="crosshair"></div>
    <div id="vignette"></div>

    <div class="absolute inset-0 z-10 pointer-events-none flex flex-col justify-between p-3 md:p-6">
        <header class="glass-hud pointer-events-auto rounded-2xl px-5 py-3.5 flex items-center justify-between shadow-2xl">
            <div class="flex items-center gap-4">
                <div class="w-11 h-11 rounded-xl bg-gradient-to-tr from-sky-600 to-teal-400 flex items-center justify-center font-black text-white text-xl shadow-lg shadow-sky-500/20">
                    R85
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <span class="px-2.5 py-0.5 rounded-full text-[10px] font-extrabold uppercase bg-teal-500/20 text-teal-400 border border-teal-500/30">Mode WebXR + Audio 3D</span>
                        <h1 class="text-sm md:text-base font-extrabold text-white tracking-wide">RESTEV 85 — Simulation HSE Immersion VR</h1>
                    </div>
                    <p class="text-xs text-slate-400 font-medium mt-0.5">Interactions manettes VR, pointeurs laser et retour haptique</p>
                </div>
            </div>

            <div class="flex items-center gap-3">
                <div class="bg-slate-900/90 border border-slate-700/80 rounded-xl px-4 py-1.5 flex items-center gap-3">
                    <div class="text-right">
                        <div class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Chrono</div>
                        <div id="timer-display" class="text-xs md:text-sm font-mono font-bold text-sky-400">00:00</div>
                    </div>
                    <div class="h-6 w-px bg-slate-700"></div>
                    <div class="text-right">
                        <div class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Conformes</div>
                        <div id="score-counter" class="text-xs md:text-sm font-extrabold text-teal-400">0 / 5</div>
                    </div>
                </div>
            </div>
        </header>

        <div class="pointer-events-auto flex items-center justify-center gap-2 overflow-x-auto py-1 custom-scroll max-w-full">
            <button onclick="teleportCamera('global')" class="glass-hud hover:bg-slate-800 text-xs text-white px-3.5 py-2.5 rounded-xl transition border border-white/10">🌐 Vue Globale</button>
            <button onclick="teleportCamera('chimique')" class="glass-hud hover:bg-slate-800 text-xs text-white px-3.5 py-2.5 rounded-xl transition border border-white/10">🛢️ Solvants</button>
            <button onclick="teleportCamera('electrique')" class="glass-hud hover:bg-slate-800 text-xs text-white px-3.5 py-2.5 rounded-xl transition border border-white/10">⚡ Électricité</button>
            <button onclick="teleportCamera('gaz')" class="glass-hud hover:bg-slate-800 text-xs text-white px-3.5 py-2.5 rounded-xl transition border border-white/10">🍾 Bouteilles Gaz</button>
            <button onclick="teleportCamera('extincteur')" class="glass-hud hover:bg-slate-800 text-xs text-white px-3.5 py-2.5 rounded-xl transition border border-white/10">🧯 Extincteur</button>
            <button onclick="teleportCamera('meuleuse')" class="glass-hud hover:bg-slate-800 text-xs text-white px-3.5 py-2.5 rounded-xl transition border border-white/10">⚙️ Meuleuse</button>
        </div>

        <div class="flex items-end justify-between w-full pt-2">
            <div class="pointer-events-auto glass-hud p-2 rounded-2xl grid grid-cols-3 gap-1 w-32 h-32 opacity-85 shadow-2xl">
                <div></div>
                <button onmousedown="startNav('forward')" onmouseup="stopNav()" class="bg-slate-800 hover:bg-sky-600 rounded-lg text-sm text-white font-bold">▲</button>
                <div></div>
                <button onmousedown="startNav('left')" onmouseup="stopNav()" class="bg-slate-800 hover:bg-sky-600 rounded-lg text-sm text-white font-bold">◀</button>
                <button onclick="teleportCamera('global')" class="bg-sky-600 rounded-lg text-xs text-white font-bold">🎯</button>
                <button onmousedown="startNav('right')" onmouseup="stopNav()" class="bg-slate-800 hover:bg-sky-600 rounded-lg text-sm text-white font-bold">▶</button>
                <div></div>
                <button onmousedown="startNav('backward')" onmouseup="stopNav()" class="bg-slate-800 hover:bg-sky-600 rounded-lg text-sm text-white font-bold">▼</button>
                <div></div>
            </div>

            <button id="vr-btn" onclick="enterVRMode()" class="pointer-events-auto bg-gradient-to-r from-teal-500 to-sky-500 hover:from-teal-400 hover:to-sky-400 text-white font-extrabold px-6 py-3.5 rounded-2xl shadow-2xl flex items-center gap-2 border border-white/20 transition transform active:scale-95 text-sm">
                <span class="text-lg">🥽</span> Lancer la VR WebXR
            </button>
        </div>
    </div>

    <!-- Modale d'intervention -->
    <div id="hazard-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 opacity-0 pointer-events-none transition-all duration-300">
        <div class="glass-card max-w-xl w-full rounded-3xl p-6 border border-white/20 shadow-2xl custom-scroll max-h-[90vh] overflow-y-auto">
            <div class="flex items-start justify-between gap-4 mb-4 pb-4 border-b border-slate-800">
                <div class="flex items-center gap-3.5">
                    <div id="modal-icon" class="w-14 h-14 rounded-2xl bg-red-500/20 border border-red-500/40 text-3xl flex items-center justify-center text-red-400 shadow-lg">⚠️</div>
                    <div>
                        <div class="flex items-center gap-2 mb-1">
                            <span id="modal-category" class="px-2.5 py-0.5 rounded-full text-[10px] font-extrabold uppercase bg-red-500/20 text-red-400 border border-red-500/30">RISQUE SÉCURITÉ</span>
                        </div>
                        <h2 id="modal-title" class="text-lg md:text-xl font-extrabold text-white">Anomalie Détectée</h2>
                    </div>
                </div>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white p-2">✕</button>
            </div>
            <div class="space-y-4 text-sm text-slate-300">
                <div class="bg-slate-900/80 p-4 rounded-2xl border border-slate-800"><p id="modal-desc" class="text-slate-200"></p></div>
                <div class="bg-slate-900/80 p-4 rounded-2xl border border-slate-800"><p id="modal-consequence" class="text-slate-200"></p></div>
                <div class="bg-sky-950/40 border-l-4 border-sky-500 p-4 text-xs text-sky-200"><span id="modal-ref"></span></div>
            </div>
            <div class="mt-6 flex items-center gap-3">
                <button onclick="closeModal()" class="flex-1 py-3 px-4 rounded-xl bg-slate-800 text-slate-300 font-bold text-xs">Fermer</button>
                <button id="modal-fix-btn" onclick="fixCurrentHazard()" class="flex-1 py-3 px-4 rounded-xl bg-teal-500 text-white font-extrabold text-xs shadow-xl">🛠️ Appliquer la Correction</button>
            </div>
        </div>
    </div>

    <script>
        const HAZARDS = {
            chimique: { id: 'chimique', category: 'Risque Chimique', title: 'Fût de Solvant sans Rétention', icon: '🛢️', desc: 'Fût de 200 L en fuite directe sur le sol.', consequence: 'Risque d\'incendie COV et glissade.', ref: 'Art. R4412-17 & INRS ED 6026', cameraPos: { x: -3.8, y: 1.2, z: -0.2 }, lookAt: { x: -3.8, y: 0.5, z: -1.8 }, beaconPos: { x: -3.8, y: 1.3, z: -1.8 }, fixed: false },
            electrique: { id: 'electrique', category: 'Risque Électrique', title: 'Armoire Ouverte & Câble Dénudé', icon: '⚡', desc: 'Câble dénudé au sol traversant l\'allée.', consequence: 'Électrocution et arc électrique.', ref: 'Art. R4226-9 & R4224-3', cameraPos: { x: 0, y: 1.3, z: 2.8 }, lookAt: { x: 0, y: 0.1, z: 1.0 }, beaconPos: { x: 0, y: 0.5, z: 1.1 }, fixed: false },
            gaz: { id: 'gaz', category: 'Gaz Comprimé', title: 'Bouteilles d\'O2/AC Non Arrimées', icon: '🍾', desc: 'Bouteilles sous pression instables.', consequence: 'Explosion ou rupture du détendeur.', ref: 'INRS ED 6098', cameraPos: { x: 3.8, y: 1.5, z: -1.8 }, lookAt: { x: 3.8, y: 1.2, z: -3.8 }, beaconPos: { x: 3.8, y: 1.6, z: -3.8 }, fixed: false },
            extincteur: { id: 'extincteur', category: 'Incendie', title: 'Accès Extincteur Obstrué', icon: '🧯', desc: 'Palettes bloquant l\'accès d\'urgence.', consequence: 'Incapacité d\'intervenir sur feu naissant.', ref: 'Art. R4227-33 & NF S 61-919', cameraPos: { x: 4.0, y: 1.4, z: 3.2 }, lookAt: { x: 4.8, y: 1.2, z: 1.8 }, beaconPos: { x: 4.8, y: 1.7, z: 1.8 }, fixed: false },
            meuleuse: { id: 'meuleuse', category: 'Équipement', title: 'Meuleuse sans Carter', icon: '⚙️', desc: 'Disque abrasif à nu sans carter.', consequence: 'Projection mortelle en cas d\'éclatement.', ref: 'Art. R4324-1 & NF EN 60745-2-3', cameraPos: { x: -1.6, y: 1.4, z: -2.8 }, lookAt: { x: -1.8, y: 0.95, z: -4.0 }, beaconPos: { x: -1.8, y: 1.2, z: -4.0 }, fixed: false }
        };

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x030712);
        scene.fog = new THREE.FogExp2(0x030712, 0.030);

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 2.2, 5.5);

        // --- AUDIO SPATIAL 3D (Web Audio Listener) ---
        const audioListener = new THREE.AudioListener();
        camera.add(audioListener);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.22;
        container.appendChild(renderer.domElement);
        renderer.xr.enabled = true;

        const composer = new THREE.EffectComposer(renderer);
        composer.addPass(new THREE.RenderPass(scene, camera));
        const bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.45, 0.4, 0.82);
        composer.addPass(bloomPass);

        // --- CHARGEUR GLTF POUR OBJETS EXTERNES ---
        const gltfLoader = new THREE.GLTFLoader();

        // --- MANETTES VR & POINTEURS LASER ---
        const controller1 = renderer.xr.getController(0);
        const controller2 = renderer.xr.getController(1);
        scene.add(controller1); scene.add(controller2);

        function createLaserPointer() {
            const geometry = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, -5)]);
            const material = new THREE.LineBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.8 });
            return new THREE.Line(geometry, material);
        }
        controller1.add(createLaserPointer());
        controller2.add(createLaserPointer());

        // Interactions par gâchette VR
        controller1.addEventListener('selectstart', onVRSelect);
        controller2.addEventListener('selectstart', onVRSelect);

        function triggerHaptic(controller) {
            if (controller && controller.gamepad && controller.gamepad.hapticActuators && controller.gamepad.hapticActuators.length > 0) {
                controller.gamepad.hapticActuators[0].pulse(0.6, 80); // 80ms de vibration
            }
        }

        function onVRSelect(event) {
            const controller = event.target;
            const tempMatrix = new THREE.Matrix4();
            tempMatrix.identity().extractRotation(controller.matrixWorld);

            const vrRaycaster = new THREE.Raycaster();
            vrRaycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
            vrRaycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);

            const intersects = vrRaycaster.intersectObjects(scene.children, true);
            for (let i = 0; i < intersects.length; i++) {
                if (intersects[i].object.userData && intersects[i].object.userData.hazardId) {
                    triggerHaptic(controller);
                    openModal(intersects[i].object.userData.hazardId);
                    break;
                }
            }
        }

        // --- ÉCLAIRAGE INDUSTRIEL ---
        const ambientLight = new THREE.HemisphereLight(0xdbeafe, 0x090d16, 0.65); scene.add(ambientLight);
        const mainSun = new THREE.DirectionalLight(0xffedd5, 1.8); 
        mainSun.position.set(-6, 9, 5); mainSun.castShadow = true;
        mainSun.shadow.mapSize.set(2048, 2048); mainSun.shadow.bias = -0.0003;
        scene.add(mainSun);

        // Sol et Structure
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.4 });
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(16, 14), floorMat);
        floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

        const hazardMeshGroups = {};
        let currentSelectedHazard = null;

        // Fût Chimie
        const chemGroup = new THREE.Group();
        const drum = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.32, 0.95, 24), new THREE.MeshStandardMaterial({ color: 0xb91c1c, metalness: 0.7 }));
        drum.position.y = 0.475; drum.castShadow = true; drum.userData = { hazardId: 'chimique' }; chemGroup.add(drum);
        chemGroup.position.set(-3.8, 0, -1.8); scene.add(chemGroup); hazardMeshGroups.chimique = chemGroup;

        // Électrique
        const cableGroup = new THREE.Group();
        const cab = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.2, 0.25), new THREE.MeshStandardMaterial({ color: 0x475569 }));
        cab.position.set(0, 1.8, -6.9); cab.userData = { hazardId: 'electrique' }; scene.add(cab);
        hazardMeshGroups.electrique = cableGroup;

        // Gaz
        const gasGroup = new THREE.Group();
        const bot = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 1.4, 20), new THREE.MeshStandardMaterial({ color: 0x15803d }));
        bot.position.set(3.8, 0.7, -3.8); bot.rotation.z = 0.12; bot.userData = { hazardId: 'gaz' }; gasGroup.add(bot);
        scene.add(gasGroup); hazardMeshGroups.gaz = gasGroup;

        // Extincteur
        const extGroup = new THREE.Group();
        const ext = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 0.75, 20), new THREE.MeshStandardMaterial({ color: 0xdc2626 }));
        ext.position.set(4.8, 1.3, 1.8); ext.userData = { hazardId: 'extincteur' }; extGroup.add(ext);
        scene.add(extGroup); hazardMeshGroups.extincteur = extGroup;

        // Meuleuse
        const toolGroup = new THREE.Group();
        const bench = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.12, 1.2), new THREE.MeshStandardMaterial({ color: 0x334155 }));
        bench.position.set(-1.8, 0.88, -4.0); scene.add(bench);
        const grinder = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.35, 16), new THREE.MeshStandardMaterial({ color: 0x0284c7 }));
        grinder.rotation.z = Math.PI / 2; grinder.position.set(-1.8, 1.0, -4.0); grinder.userData = { hazardId: 'meuleuse' }; toolGroup.add(grinder);
        scene.add(toolGroup); hazardMeshGroups.meuleuse = toolGroup;

        // --- NAVIGATION & SOURIS ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let hoveredHazardId = null;

        window.addEventListener('mousemove', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(scene.children, true);
            let found = null;
            for (let i = 0; i < intersects.length; i++) {
                if (intersects[i].object.userData && intersects[i].object.userData.hazardId) {
                    found = intersects[i].object.userData.hazardId; break;
                }
            }
            if (found !== hoveredHazardId) {
                hoveredHazardId = found;
                document.getElementById('crosshair').classList.toggle('active', !!hoveredHazardId);
            }
        });

        window.addEventListener('click', (e) => {
            if (e.target.closest('.pointer-events-auto')) return;
            if (hoveredHazardId) openModal(hoveredHazardId);
        });

        function openModal(hazardId) {
            currentSelectedHazard = HAZARDS[hazardId]; if (!currentSelectedHazard) return;
            document.getElementById('modal-icon').innerText = currentSelectedHazard.icon;
            document.getElementById('modal-title').innerText = currentSelectedHazard.title;
            document.getElementById('modal-category').innerText = currentSelectedHazard.category;
            document.getElementById('modal-desc').innerText = currentSelectedHazard.desc;
            document.getElementById('modal-consequence').innerText = currentSelectedHazard.consequence;
            document.getElementById('modal-ref').innerText = currentSelectedHazard.ref;
            document.getElementById('hazard-modal').classList.remove('opacity-0', 'pointer-events-none');
        }

        function closeModal() {
            document.getElementById('hazard-modal').classList.add('opacity-0', 'pointer-events-none');
        }

        function fixCurrentHazard() {
            if (!currentSelectedHazard) return;
            currentSelectedHazard.fixed = true;
            closeModal();
            const fixedCount = Object.values(HAZARDS).filter(h => h.fixed).length;
            document.getElementById('score-counter').innerText = `${fixedCount} / 5`;
        }

        let targetCamPos = camera.position.clone(), targetLookAt = new THREE.Vector3(0, 1.5, 0);
        function teleportCamera(key) {
            if (key === 'global') { targetCamPos.set(0, 2.2, 5.5); targetLookAt.set(0, 1.5, 0); }
            else if (HAZARDS[key]) {
                targetCamPos.set(HAZARDS[key].cameraPos.x, HAZARDS[key].cameraPos.y, HAZARDS[key].cameraPos.z);
                targetLookAt.set(HAZARDS[key].lookAt.x, HAZARDS[key].lookAt.y, HAZARDS[key].lookAt.z);
            }
        }

        function enterVRMode() {
            if ('xr' in navigator) {
                navigator.xr.isSessionSupported('immersive-vr').then(supp => {
                    if (supp) navigator.xr.requestSession('immersive-vr').then(s => renderer.xr.setSession(s));
                    else alert("Casque VR non détecté. Connecte ton casque Meta Quest / Pico.");
                });
            }
        }

        function animate() {
            renderer.setAnimationLoop(() => {
                camera.position.lerp(targetCamPos, 0.08);
                camera.lookAt(targetLookAt);
                composer.render();
            });
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight); composer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
