<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>RESTEV 85 - Chasse aux Risques VR Ultra-Réaliste</title>
    <style>
        :root {
            --primary: #005a9c;
            --primary-dark: #003d6b;
            --secondary: #00a88f;
            --danger: #e74c3c;
            --success: #2ecc71;
            --warning: #f39c12;
            --bg-dark: #0f172a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000;
            color: #fff;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Interface utilisateur (UI) */
        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 12px;
        }

        .interactive {
            pointer-events: auto;
        }

        header {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px);
            padding: 10px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 25px rgba(0,0,0,0.5);
        }

        .logo-title h1 {
            font-size: 1.1rem;
            font-weight: 800;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.5px;
        }

        .logo-title span {
            color: var(--secondary);
            font-size: 0.75rem;
            display: block;
            font-weight: 500;
        }

        .score-badge {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85rem;
            border: 1px solid rgba(255,255,255,0.2);
            white-space: nowrap;
            box-shadow: 0 2px 10px rgba(0,90,156,0.4);
        }

        .start-hint {
            position: absolute;
            top: 75px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.75);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: #e2e8f0;
            pointer-events: none;
            border: 1px solid rgba(255,255,255,0.1);
            animation: pulse 2s infinite;
            white-space: nowrap;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.7; transform: translateX(-50%) scale(1); }
            50% { opacity: 1; transform: translateX(-50%) scale(1.03); }
        }

        /* Navigation rapide */
        .nav-shortcuts {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding: 6px 0;
            -webkit-overflow-scrolling: touch;
        }

        .nav-btn {
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
            backdrop-filter: blur(4px);
        }

        .nav-btn:active {
            transform: scale(0.95);
            background: var(--primary);
        }

        /* Contrôles bas de page */
        .controls-bottom {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 8px;
        }

        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 44px);
            grid-template-rows: repeat(3, 44px);
            gap: 4px;
            background: rgba(15, 23, 42, 0.7);
            padding: 6px;
            border-radius: 14px;
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .dpad-btn {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: white;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.15s;
        }

        .dpad-btn:active {
            background: var(--secondary);
        }

        .btn-vr {
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 12px 22px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 0.9rem;
            box-shadow: 0 4px 20px rgba(0, 168, 143, 0.5);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.2s;
        }

        .btn-vr:active {
            transform: scale(0.95);
        }

        /* Modal Pédagogique */
        .modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            max-width: 480px;
            width: 100%;
            padding: 22px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            transform: translateY(20px);
            transition: transform 0.3s ease;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal.active .modal-content {
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
        }

        .modal-icon {
            font-size: 2rem;
            background: rgba(231, 76, 60, 0.2);
            width: 52px;
            height: 52px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--danger);
            border: 1px solid rgba(231, 76, 60, 0.3);
        }

        .modal-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
        }

        .modal-body {
            font-size: 0.9rem;
            line-height: 1.6;
            color: #cbd5e1;
            margin-bottom: 20px;
        }

        .ref-box {
            background: rgba(0, 90, 156, 0.25);
            border-left: 4px solid var(--primary);
            padding: 10px 14px;
            border-radius: 4px;
            font-size: 0.8rem;
            margin-top: 12px;
            color: #93c5fd;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
        }

        .btn-action {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .btn-fix {
            background: var(--success);
            color: #fff;
            box-shadow: 0 4px 12px rgba(46, 204, 113, 0.3);
        }

        .btn-close {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }
    </style>
    <!-- Three.js r128 universel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="ui-overlay">
        <!-- En-tête -->
        <header class="interactive">
            <div class="logo-title">
                <h1>RESTEV 85 <span>Santé & Prévention au Travail</span></h1>
            </div>
            <div class="score-badge" id="score">0 / 5 Risques Identifiés</div>
        </header>

        <div class="start-hint">🔎 Observez l atelier & cliquez sur les zones à risques</div>

        <!-- Navigation rapide -->
        <div class="nav-shortcuts interactive">
            <button class="nav-btn" onclick="teleportTo('global')">🌐 Vue Ensemble</button>
            <button class="nav-btn" onclick="teleportTo('chimique')">🛢️ Risque Chimique</button>
            <button class="nav-btn" onclick="teleportTo('electrique')">⚡ Câble Éléc.</button>
            <button class="nav-btn" onclick="teleportTo('gaz')">🍾 Bouteilles Gaz</button>
            <button class="nav-btn" onclick="teleportTo('extincteur')">🧯 Extincteur</button>
            <button class="nav-btn" onclick="teleportTo('meuleuse')">⚙️ Meuleuse</button>
        </div>

        <!-- Contrôles bas de page -->
        <div class="controls-bottom">
            <!-- D-Pad pour déplacement mobile -->
            <div class="dpad interactive">
                <div></div>
                <button class="dpad-btn" onmousedown="moveCam('forward')" ontouchstart="moveCam('forward')">⬆️</button>
                <div></div>
                <button class="dpad-btn" onmousedown="moveCam('left')" ontouchstart="moveCam('left')">⬅️</button>
                <button class="dpad-btn" onclick="teleportTo('global')">🎯</button>
                <button class="dpad-btn" onmousedown="moveCam('right')" ontouchstart="moveCam('right')">➡️</button>
                <div></div>
                <button class="dpad-btn" onmousedown="moveCam('backward')" ontouchstart="moveCam('backward')">⬇️</button>
                <div></div>
            </div>

            <!-- Bouton WebXR -->
            <button class="btn-vr interactive" id="vr-btn" onclick="startVR()">🥽 Mode VR</button>
        </div>
    </div>

    <!-- Fenêtre Modale Pédagogique -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-icon" id="m-icon">⚠️</div>
                <div class="modal-title" id="m-title">Titre du Risque</div>
            </div>
            <div class="modal-body">
                <p id="m-desc">Description de la situation de travail dangereuse...</p>
                <div class="ref-box" id="m-ref">
                    <strong>Réglementation :</strong> Code du Travail / INRS
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn-action btn-close" onclick="closeModal()">Fermer</button>
                <button class="btn-action btn-fix" id="m-fix-btn" onclick="fixCurrentRisk()">Corriger le risque</button>
            </div>
        </div>
    </div>

    <script>
        // --- SYNTHÉTISEUR AUDIO WEB AUDIO API (Effets sonores réalistes sans fichiers) ---
        class SoundEngine {
            constructor() {
                this.ctx = null;
            }
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }
            playClick() {
                this.init();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(400, this.ctx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.05);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.05);
            }
            playSpark() {
                this.init();
                if (!this.ctx) return;
                const bufferSize = this.ctx.sampleRate * 0.08;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;
                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
                noise.connect(gain);
                gain.connect(this.ctx.destination);
                noise.start();
            }
            playSuccess() {
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.08);
                    gain.gain.setValueAtTime(0.2, now + idx * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.3);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + idx * 0.08);
                    osc.stop(now + idx * 0.08 + 0.3);
                });
            }
        }
        const sounds = new SoundEngine();

        // --- DONNÉES DES 5 RISQUES ---
        const risksData = {
            chimique: {
                id: 'chimique',
                title: 'Bidon de Solvant sans Rétention',
                icon: '🛢️',
                desc: 'Un produit chimique inflammable fuit directement sur le sol de l atelier. Absence de bac de rétention et de Fiche de Données de Sécurité (FDS).',
                ref: 'Code du Travail Art. R4412-17 & R4412-22 (Stockage obligatoire sur bac de rétention étanche).',
                pos: { x: -3.8, y: 1.1, z: -1.5 },
                fixed: false
            },
            electrique: {
                id: 'electrique',
                title: 'Câble Électrique Dénudé au Sol',
                icon: '⚡',
                desc: 'Une rallonge électrique détériorée traverse l allée piétonne et produit des étincelles. Risque majeur d électrocution et de chute.',
                ref: 'Code du Travail Art. R4224-3 (Allées de passage dégagées) & Art. R4226-9 (Maintien en état des installations).',
                pos: { x: 0, y: 0.4, z: 1.2 },
                fixed: false
            },
            gaz: {
                id: 'gaz',
                title: 'Bouteilles d Acétylène non Arrimées',
                icon: '🍾',
                desc: 'Les bouteilles de gaz sous pression sont stockées debout sans chaîne de sécurité. Risque de chute, de rupture de valve et de projection.',
                ref: 'INRS ED 6098 (Stockage et arrimage sécurisé des bouteilles de gaz).',
                pos: { x: 3.8, y: 1.6, z: -3.2 },
                fixed: false
            },
            extincteur: {
                id: 'extincteur',
                title: 'Accès Extincteur Obstrué',
                icon: '🧯',
                desc: 'Des palettes en bois et cartons masquent et bloquent l accès immédiat à l extincteur d atelier en cas de départ de feu.',
                ref: 'Code du Travail Art. R4227-33 (Les équipements de premier secours doivent être dégagés et signalés).',
                pos: { x: 4.2, y: 1.3, z: 2.2 },
                fixed: false
            },
            meuleuse: {
                id: 'meuleuse',
                title: 'Meuleuse sans Carter de Protection',
                icon: '⚙️',
                desc: 'Une meuleuse d angle posée sur l établi a été dépouillée de son carter de protection. Risque d éclat de disque mortel.',
                ref: 'Code du Travail Art. R4324-1 à R4324-4 (Protections obligatoires des éléments mobiles de travail).',
                pos: { x: -1.5, y: 1.3, z: -3.8 },
                fixed: false
            }
        };

        let currentActiveRisk = null;
        let scoreCount = 0;

        // --- GÉNÉRATION PROCÉDURALE DE TEXTURES HAUTE DÉFINITION ---
        function generateTextures() {
            // Texture Béton
            const cvFloor = document.createElement('canvas');
            cvFloor.width = 512; cvFloor.height = 512;
            const ctxF = cvFloor.getContext('2d');
            ctxF.fillStyle = '#334155'; ctxF.fillRect(0,0,512,512);
            for(let i=0; i<8000; i++) {
                ctxF.fillStyle = Math.random() > 0.5 ? 'rgba(255,255,255,0.04)' : 'rgba(0,0,0,0.06)';
                ctxF.fillRect(Math.random()*512, Math.random()*512, 2, 2);
            }
            const floorTex = new THREE.CanvasTexture(cvFloor);
            floorTex.wrapS = THREE.RepeatWrapping; floorTex.wrapT = THREE.RepeatWrapping;
            floorTex.repeat.set(4, 4);

            // Texture Métal/Briques
            const cvWall = document.createElement('canvas');
            cvWall.width = 256; cvWall.height = 256;
            const ctxW = cvWall.getContext('2d');
            ctxW.fillStyle = '#1e293b'; ctxW.fillRect(0,0,256,256);
            ctxW.strokeStyle = 'rgba(255,255,255,0.05)';
            for(let y=0; y<256; y+=32) {
                ctxW.beginPath(); ctxW.moveTo(0, y); ctxW.lineTo(256, y); ctxW.stroke();
            }
            const wallTex = new THREE.CanvasTexture(cvWall);

            return { floorTex, wallTex };
        }

        const { floorTex, wallTex } = generateTextures();

        // --- SCENE 3D SETUP ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f172a);
        scene.fog = new THREE.FogExp2(0x0f172a, 0.04);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 2.2, 5.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // --- ÉCLAIRAGE INDUSTRIEL ET AMBIANT ---
        const ambientLight = new THREE.AmbientLight(0x94a3b8, 0.7);
        scene.add(ambientLight);

        // Lampes de plafond d'atelier
        function addCeilingLight(x, z) {
            const light = new THREE.PointLight(0xffedd5, 1.2, 12);
            light.position.set(x, 4.5, z);
            light.castShadow = true;
            scene.add(light);

            // Structure physique du projecteur
            const fixtureGeo = new THREE.CylinderGeometry(0.4, 0.5, 0.15, 16);
            const fixtureMat = new THREE.MeshStandardMaterial({ color: 0x475569, metalness: 0.8 });
            const fixture = new THREE.Mesh(fixtureGeo, fixtureMat);
            fixture.position.set(x, 4.8, z);
            scene.add(fixture);
        }
        addCeilingLight(-3, -2);
        addCeilingLight(3, -2);
        addCeilingLight(0, 2);

        // --- DÉCORATION DE L'ATELIER ---
        function buildDetailedWorkshop() {
            // Sol bétonisé
            const floorGeo = new THREE.PlaneGeometry(14, 12);
            const floorMat = new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.6, metalness: 0.1 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // Murs
            const wallMat = new THREE.MeshStandardMaterial({ map: wallTex, roughness: 0.9 });
            
            const backWall = new THREE.Mesh(new THREE.PlaneGeometry(14, 6), wallMat);
            backWall.position.set(0, 3, -6);
            scene.add(backWall);

            const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(12, 6), wallMat);
            leftWall.rotation.y = Math.PI / 2;
            leftWall.position.set(-7, 3, 0);
            scene.add(leftWall);

            const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(12, 6), wallMat);
            rightWall.rotation.y = -Math.PI / 2;
            rightWall.position.set(7, 3, 0);
            scene.add(rightWall);

            // Charpente métallique au plafond
            for (let x = -6; x <= 6; x += 4) {
                const beamGeo = new THREE.BoxGeometry(0.2, 0.3, 12);
                const beamMat = new THREE.MeshStandardMaterial({ color: 0x334155, metalness: 0.7 });
                const beam = new THREE.Mesh(beamGeo, beamMat);
                beam.position.set(x, 5.2, 0);
                scene.add(beam);
            }

            // Établi mécanique en bois et acier
            const benchGroup = new THREE.Group();
            const topMesh = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.12, 1.4), new THREE.MeshStandardMaterial({ color: 0x78350f, roughness: 0.7 }));
            topMesh.position.y = 0.9;
            topMesh.castShadow = true;
            benchGroup.add(topMesh);

            const legsMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.8 });
            [[-1.5, -0.6], [1.5, -0.6], [-1.5, 0.6], [1.5, 0.6]].forEach(p => {
                const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.9), legsMat);
                leg.position.set(p[0], 0.45, p[1]);
                leg.castShadow = true;
                benchGroup.add(leg);
            });
            benchGroup.position.set(-2, 0, -4.2);
            scene.add(benchGroup);
        }

        buildDetailedWorkshop();

        // --- OBJETS 3D ET ÉTINCELLES ANIMÉES ---
        const riskObjects3D = {};
        let sparkParticles = null;

        function createDetailedRisks() {
            // 1. Bidon Chimique & Solvant au sol
            const canGroup = new THREE.Group();
            const canGeo = new THREE.CylinderGeometry(0.25, 0.25, 0.65, 20);
            const canMat = new THREE.MeshStandardMaterial({ color: 0xd97706, metalness: 0.3, roughness: 0.4 });
            const can = new THREE.Mesh(canGeo, canMat);
            can.castShadow = true;
            canGroup.add(can);

            // Flaque de produit au sol
            const puddleGeo = new THREE.CircleGeometry(0.6, 16);
            const puddleMat = new THREE.MeshStandardMaterial({ color: 0xb45309, roughness: 0.1, transparent: true, opacity: 0.7 });
            const puddle = new THREE.Mesh(puddleGeo, puddleMat);
            puddle.rotation.x = -Math.PI / 2;
            puddle.position.set(0.2, -0.31, 0.1);
            canGroup.add(puddle);

            canGroup.position.set(-3.8, 0.32, -1.5);
            scene.add(canGroup);
            riskObjects3D.chimique = canGroup;

            // 2. Câble Électrique avec Étincelles
            const cableGroup = new THREE.Group();
            const cableGeo = new THREE.CylinderGeometry(0.03, 0.03, 3.5, 12);
            const cableMat = new THREE.MeshStandardMaterial({ color: 0xeab308, roughness: 0.5 });
            const cable = new THREE.Mesh(cableGeo, cableMat);
            cable.rotation.z = Math.PI / 2.2;
            cableGroup.add(cable);

            // Système de particules pour étincelles
            const sparkGeo = new THREE.BufferGeometry();
            const sparkCoords = new Float32Array(30 * 3);
            for(let i=0; i<90; i++) sparkCoords[i] = (Math.random()-0.5)*0.2;
            sparkGeo.setAttribute('position', new THREE.BufferAttribute(sparkCoords, 3));
            const sparkMat = new THREE.PointsMaterial({ color: 0x38bdf8, size: 0.05, transparent: true });
            sparkParticles = new THREE.Points(sparkGeo, sparkMat);
            sparkParticles.position.set(0, 0.05, 0);
            cableGroup.add(sparkParticles);

            cableGroup.position.set(0, 0.02, 1.2);
            scene.add(cableGroup);
            riskObjects3D.electrique = cableGroup;

            // 3. Bouteilles de gaz instables
            const gazGroup = new THREE.Group();
            const botGeo = new THREE.CylinderGeometry(0.18, 0.18, 1.4, 16);
            const bot1 = new THREE.Mesh(botGeo, new THREE.MeshStandardMaterial({ color: 0x15803d, metalness: 0.6 }));
            const bot2 = new THREE.Mesh(botGeo, new THREE.MeshStandardMaterial({ color: 0xb91c1c, metalness: 0.6 }));
            bot1.position.x = -0.2; bot1.rotation.z = 0.1; bot1.castShadow = true;
            bot2.position.x = 0.2; bot2.rotation.z = -0.08; bot2.castShadow = true;
            gazGroup.add(bot1); gazGroup.add(bot2);
            gazGroup.position.set(3.8, 0.7, -3.2);
            scene.add(gazGroup);
            riskObjects3D.gaz = gazGroup;

            // 4. Extincteur masqué par palettes
            const extGroup = new THREE.Group();
            const extGeo = new THREE.CylinderGeometry(0.16, 0.16, 0.75, 16);
            const ext = new THREE.Mesh(extGeo, new THREE.MeshStandardMaterial({ color: 0xd97706, metalness: 0.5 }));
            ext.position.y = 0.38; ext.castShadow = true;
            extGroup.add(ext);

            // Palettes/cartons devant
            const boxGeo = new THREE.BoxGeometry(0.7, 0.6, 0.6);
            const box = new THREE.Mesh(boxGeo, new THREE.MeshStandardMaterial({ color: 0x854d0e, roughness: 0.8 }));
            box.position.set(0.05, 0.3, 0.4); box.castShadow = true;
            extGroup.add(box);

            extGroup.position.set(4.2, 0, 2.2);
            scene.add(extGroup);
            riskObjects3D.extincteur = extGroup;

            // 5. Meuleuse d'angle
            const toolGroup = new THREE.Group();
            const body = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.4, 12), new THREE.MeshStandardMaterial({ color: 0x0284c7 }));
            body.rotation.z = Math.PI/2;
            const disc = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.01, 20), new THREE.MeshStandardMaterial({ color: 0x475569, metalness: 0.9 }));
            disc.position.x = 0.2;
            toolGroup.add(body); toolGroup.add(disc);
            toolGroup.position.set(-1.5, 0.98, -3.8);
            scene.add(toolGroup);
            riskObjects3D.meuleuse = toolGroup;

            // Pastilles de détection rouges 3D
            Object.keys(risksData).forEach(key => {
                const r = risksData[key];
                const hsGeo = new THREE.SphereGeometry(0.16, 16, 16);
                const hsMat = new THREE.MeshBasicMaterial({ color: 0xef4444, wireframe: true });
                const hs = new THREE.Mesh(hsGeo, hsMat);
                hs.position.set(r.pos.x, r.pos.y, r.pos.z);
                hs.userData = { riskId: key };
                scene.add(hs);
            });
        }

        createDetailedRisks();

        // --- NAVIGATION TACTILE & ROTATION SANS BUG ---
        let isDragging = false;
        let prevX = 0, prevY = 0;
        let targetYaw = 0, targetPitch = 0;

        function onPointerDown(e) {
            isDragging = true;
            prevX = e.clientX || (e.touches && e.touches[0].clientX);
            prevY = e.clientY || (e.touches && e.touches[0].clientY);
        }

        function onPointerMove(e) {
            if (!isDragging) return;
            const x = e.clientX || (e.touches && e.touches[0].clientX);
            const y = e.clientY || (e.touches && e.touches[0].clientY);
            
            targetYaw -= (x - prevX) * 0.004;
            targetPitch -= (y - prevY) * 0.004;
            targetPitch = Math.max(-Math.PI / 4, Math.min(Math.PI / 4, targetPitch));

            prevX = x; prevY = y;
        }

        function onPointerUp() { isDragging = false; }

        window.addEventListener('mousedown', onPointerDown);
        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);
        window.addEventListener('touchstart', onPointerDown);
        window.addEventListener('touchmove', onPointerMove);
        window.addEventListener('touchend', onPointerUp);

        // --- SELECTION ET CLIC SUR ANOMALIE ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function handleSelect(e) {
            const clientX = e.clientX || (e.changedTouches && e.changedTouches[0].clientX);
            const clientY = e.clientY || (e.changedTouches && e.changedTouches[0].clientY);

            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(scene.children, true);

            for (let i = 0; i < intersects.length; i++) {
                const obj = intersects[i].object;
                if (obj.userData && obj.userData.riskId) {
                    sounds.playClick();
                    openRiskModal(obj.userData.riskId);
                    break;
                }
            }
        }

        window.addEventListener('click', handleSelect);

        // --- MODALE PÉDAGOGIQUE ---
        function openRiskModal(riskId) {
            const data = risksData[riskId];
            if (!data) return;

            currentActiveRisk = data;
            document.getElementById('m-icon').innerText = data.icon;
            document.getElementById('m-title').innerText = data.title;
            document.getElementById('m-desc').innerText = data.desc;
            document.getElementById('m-ref').innerHTML = '<strong>Réglementation :</strong> ' + data.ref;

            const fixBtn = document.getElementById('m-fix-btn');
            if (data.fixed) {
                fixBtn.innerText = '✅ Risque déjà corrigé';
                fixBtn.style.background = '#64748b';
                fixBtn.disabled = true;
            } else {
                fixBtn.innerText = 'Corriger le risque';
                fixBtn.style.background = 'var(--success)';
                fixBtn.disabled = false;
            }

            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            sounds.playClick();
            document.getElementById('modal').classList.remove('active');
        }

        function fixCurrentRisk() {
            if (!currentActiveRisk || currentActiveRisk.fixed) return;

            currentActiveRisk.fixed = true;
            scoreCount++;
            document.getElementById('score').innerText = scoreCount + ' / 5 Risques Identifiés';
            sounds.playSuccess();

            // Mettre en vert le matériel une fois sécurisé
            const targetObj = riskObjects3D[currentActiveRisk.id];
            if (targetObj) {
                targetObj.traverse(child => {
                    if (child.isMesh) child.material.color.setHex(0x2ecc71);
                });
            }

            closeModal();

            if (scoreCount === 5) {
                setTimeout(() => {
                    alert('🏆 Félicitations ! Vous avez identifié et sécurisé l ensemble des risques de l atelier RESTEV 85.');
                }, 400);
            }
        }

        // --- DEPLACEMENT ET TELEPORTATION ---
        function teleportTo(target) {
            sounds.playClick();
            if (target === 'global') {
                camera.position.set(0, 2.2, 5.5);
                targetYaw = 0; targetPitch = 0;
            } else if (risksData[target]) {
                const p = risksData[target].pos;
                camera.position.set(p.x, p.y + 0.2, p.z + 1.6);
            }
        }

        function moveCam(dir) {
            sounds.playClick();
            const speed = 0.5;
            if (dir === 'forward') camera.position.z -= speed;
            if (dir === 'backward') camera.position.z += speed;
            if (dir === 'left') camera.position.x -= speed;
            if (dir === 'right') camera.position.x += speed;
        }

        // --- VR WEBXR ---
        function startVR() {
            sounds.playClick();
            if ('xr' in navigator) {
                navigator.xr.requestSession('immersive-vr').then(session => {
                    renderer.xr.enabled = true;
                    renderer.xr.setSession(session);
                }).catch(() => alert('Casque VR non détecté ou mode non disponible.'));
            } else {
                alert('Ouvrez ce lien directement dans le navigateur de votre casque VR (Meta Quest Browser).');
            }
        }

        // --- BOUCLE D'ANIMATION EN TEMPS RÉEL ---
        let clock = new THREE.Clock();

        function animate() {
            renderer.setAnimationLoop(() => {
                const delta = clock.getDelta();

                // Animation des étincelles électriques
                if (sparkParticles && Math.random() > 0.6) {
                    sounds.playSpark();
                    sparkParticles.visible = !sparkParticles.visible;
                }

                camera.rotation.y = targetYaw;
                camera.rotation.x = targetPitch;

                renderer.render(scene, camera);
            });
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
